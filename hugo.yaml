# Hugo configuration file
title: "Ingeniería del Software 2"

# Import the hextra theme as a module
module:
  imports:
    - path: github.com/imfing/hextra

  mounts:
  - source: assets
    target: assets
  - disableWatch: true
    source: hugo_stats.json
    target: assets/notwatching/hugo_stats.json

markup:
  # Allow raw HTML
  goldmark:
    renderer:
      unsafe: true

  # Enable hextra's syntax highlighting
  highlight:
    noClasses: false

build:
  buildStats:
    enable: true
  cachebusters:
  - source: 'assets/notwatching/hugo_stats\.json'
    target: css
  - source: '(postcss|tailwind)\.config\.js'
    target: css

menu:
  main:
    - name: "Docentes"
      pageRef: "/team"
      weight: 2

    - name: "Regimen"
      pageRef: "/regimen"
      weight: 3

    - name: "TPs"
      pageRef: "/tps"
      weight: 5

    - name: "Material"
      pageRef: "/material"
      weight: 6

    - name: "Encuestas"
      pageRef: "/blog/surveys"
      weight: 7

    - name: "Contacto"
      pageRef: "/contact"
      weight: 8


