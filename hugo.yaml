# Hugo configuration file
title: "Ingeniería del Software 2"
defaultContentLanguage: es
locale: es-AR

languages:
  es:
    locale: es-AR
    label: Español
    weight: 1

security:
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^postcss$'
      - '^tailwindcss$'

# Import the hextra theme as a module
module:
  imports:
    - path: github.com/imfing/hextra

  mounts:
    - source: assets
      target: assets
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json

markup:
  # Allow raw HTML
  goldmark:
    renderer:
      unsafe: true

  # Enable hextra's syntax highlighting
  highlight:
    noClasses: false

build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css
    - source: '(postcss|tailwind)\.config\.js'
      target: css

outputs:
  page: [html, markdown]
  section: [html, rss, markdown]

mediaTypes:
  "text/markdown":
    suffixes: ["md"]

outputFormats:
  markdown:
    mediaType: "text/markdown"
    isPlainText: true

menu:
  main:
    - name: "Docentes"
      pageRef: "/team"
      weight: 2

    - name: "Regimen"
      pageRef: "/regimen"
      weight: 3

    - name: "Programa"
      pageRef: "/programa"
      weight: 4

    - name: "Material"
      pageRef: "/material"
      weight: 5

    - name: "TPs"
      pageRef: "/tps"
      weight: 6

    - name: "Encuestas"
      pageRef: "/surveys"
      weight: 7

    - name: "Contacto"
      url: "#contacto"
      weight: 8

    # - name: "Buscar"
    #   weight: 9
    #   params:
    #     type: search

    # - name: Slack
    #   weight: 10
    #   url: https://join.slack.com/t/ta049-ingsoftii/shared_invite/zt-2owpvl6tc-P1NHgQKAbci049EohALmTg
    #   params:
    #     icon: academic-cap

params:
  navbar:
    displayTitle: true
    displayLogo: false

  page:
    contextMenu:
      enable: true

  search:
    enable: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
