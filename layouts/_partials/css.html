<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script>
  tailwind.config = { darkMode: "class" };
</script>
{{ else }} {{ with resources.Get "css/tailwind.css" }} {{ $opts := dict "minify"

/>
