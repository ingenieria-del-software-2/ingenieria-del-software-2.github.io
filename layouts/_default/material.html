{{ define "main" }}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material de Referencia</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        },
                        accent: {
                            50: '#f0f9ff',
                            100: '#e0f7ff',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        gray: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                            950: '#030712'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .accordion-content {
            transition: grid-template-rows 0.3s ease-out;
            display: grid;
            grid-template-rows: 0fr;
        }
        .accordion-content.open {
            grid-template-rows: 1fr;
        }
        .accordion-inner {
            overflow: hidden;
            opacity: 0;
            transform: translateY(-0.5rem);
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
        }
        .accordion-content.open .accordion-inner {
            opacity: 1;
            transform: translateY(0);
        }
        
        .animated-grid {
            animation: scroll-background 60s linear infinite;
        }

        @keyframes scroll-background {
            0% { background-position: 0 0; }
            100% { background-position: -384px -256px; }
        }
    </style>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-white transition-colors duration-300 min-h-screen relative">

    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
         <div class="animated-grid absolute inset-0 -z-10 h-full w-full bg-[linear-gradient(to_right,#f0f9ff_1px,transparent_1px),linear-gradient(to_bottom,#f0f9ff_1px,transparent_1px)] dark:bg-[linear-gradient(to_right,#1f2937_1px,transparent_1px),linear-gradient(to_bottom,#1f2937_1px,transparent_1px)] bg-[size:6rem_4rem] opacity-60">
            <div class="absolute inset-0 bg-[radial-gradient(circle_500px_at_20%_200px,#e0f7ff,transparent)] dark:bg-[radial-gradient(circle_800px_at_50%_200px,#0c4a6e,transparent)]"></div>
        </div>
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-400/20 dark:bg-blue-900/10 rounded-full blur-3xl mix-blend-multiply dark:mix-blend-lighten filter"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-purple-400/20 dark:bg-purple-900/10 rounded-full blur-3xl mix-blend-multiply dark:mix-blend-lighten filter"></div>
    </div>

    <div class="relative z-10">
        {{ partial "sidebar.html" (dict "context" . "disableSidebar" true) }}

        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pt-12 pb-12 text-center">
             <h1 class="inline-flex items-center justify-center p-2 mb-6 rounded-full bg-white/50 dark:bg-gray-800/50 backdrop-blur-sm shadow-sm ring-1 ring-gray-900/5 dark:ring-white/10">
                <img src="/images/logo.png" alt="Logo" class="w-8 h-8 rounded-full mr-3 dark:invert">
                <span class="text-xl font-semibold text-gray-800 dark:text-gray-100 pr-4">
                    Material de Referencia
                </span>
            </h1>
            <p class="text-lg text-gray-600 dark:text-gray-400 max-w-2xl mx-auto">
                Videos tutoriales, guías y recursos organizados por temas para facilitar tu aprendizaje.
            </p>
        </div>

        <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pb-32">
             <div id="sections-container" class="space-y-6">
                <!-- Content injected by JS -->
             </div>
        </main>
    </div>

    <div id="video-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/90 p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="relative w-full max-w-5xl transform scale-95 transition-transform duration-300" id="video-modal-content">
            <button id="close-modal" class="absolute -top-12 right-0 p-2 text-white hover:text-gray-300 transition-colors focus:outline-none">
                <i data-lucide="x" class="w-8 h-8"></i>
            </button>
            <div class="relative aspect-video bg-black rounded-xl overflow-hidden shadow-2xl ring-1 ring-white/10">
                <iframe id="youtube-iframe" class="w-full h-full" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        // --- DATA ---
        const courseSections = JSON.parse('{{ .Site.Data.material.sections | jsonify | safeJS }}');

        // --- HELPER FUNCTIONS ---
        
        // Extract YouTube ID
        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return match && match[2].length === 11 ? match[2] : null;
        }

        async function fetchVideoTitle(url, elementId) {
            try {
                // Usamos noembed como proxy para oEmbed (no requiere API Key)
                const response = await fetch(`https://noembed.com/embed?url=${url}`);
                const data = await response.json();
                if (data.title) {
                    const el = document.getElementById(elementId);
                    if (el) el.textContent = data.title;
                }
            } catch (error) {
                console.error('Error fetching title:', error);
            }
        }

        // --- RENDER FUNCTIONS ---

        function renderVideoCard(video, index) {
            const videoId = getYouTubeId(video.url);
            const thumbnailUrl = videoId 
                ? `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`
                : 'https://via.placeholder.com/640x360';
            
            // Fallback para imágenes rotas
            const onError = `this.src='https://img.youtube.com/vi/${videoId}/hqdefault.jpg'`;
            
            // Generar ID único para actualización asíncrona del título
            const titleId = `video-title-${videoId}-${index}`;
            const titleHtml = video.title 
                ? video.title 
                : `<span id="${titleId}" class="animate-pulse">Cargando título...</span>`;

            // Si no hay título, iniciamos la búsqueda
            if (!video.title && video.url) {
                fetchVideoTitle(video.url, titleId);
            }

            return `
                <div class="group relative bg-gray-50 dark:bg-gray-900/50 rounded-xl overflow-hidden border border-gray-200 dark:border-gray-700 hover:border-blue-400 dark:hover:border-blue-600 transition-all duration-300 hover:shadow-lg cursor-pointer" onclick="openVideo('${videoId}')">
                    <div class="relative aspect-video bg-gray-200 dark:bg-gray-800">
                        <img src="${thumbnailUrl}" alt="Video thumbnail" class="w-full h-full object-cover" onerror="${onError}">
                        
                        <div class="absolute inset-0 flex items-center justify-center bg-gradient-to-b from-black/10 via-black/20 to-black/40 group-hover:from-black/20 group-hover:via-black/30 group-hover:to-black/50 transition-all">
                            <div class="w-16 h-16 bg-white/20 dark:bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center group-hover:scale-110 group-hover:bg-white/30 dark:group-hover:bg-white/20 transition-all shadow-lg border border-white/30 dark:border-white/20">
                                <i data-lucide="play" class="w-7 h-7 text-white fill-current ml-1"></i>
                            </div>
                        </div>

                        ${video.duration ? `
                        <div class="absolute bottom-2 right-2 px-2 py-1 bg-black/80 text-white text-xs font-medium rounded">
                            ${video.duration}
                        </div>
                        ` : ''}
                    </div>
                    <div class="p-4">
                        <h4 class="font-semibold text-gray-900 dark:text-white mb-1 line-clamp-2">${titleHtml}</h4>
                        ${video.description ? `<p class="text-sm text-gray-600 dark:text-gray-400 line-clamp-2">${video.description}</p>` : ''}
                    </div>
                </div>
            `;
        }

        function renderResourceLink(resource) {
            const icon = resource.type === 'document' ? 'file-text' : 'link';
            return `
                <a href="${resource.url}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 p-4 bg-gray-50 dark:bg-gray-900/50 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-purple-400 dark:hover:border-purple-600 hover:bg-purple-50 dark:hover:bg-purple-900/20 transition-all duration-200 group">
                    <div class="flex-shrink-0 w-10 h-10 bg-white dark:bg-gray-800 rounded-lg flex items-center justify-center border border-gray-200 dark:border-gray-700 group-hover:border-purple-400 dark:group-hover:border-purple-600 transition-colors">
                        <i data-lucide="${icon}" class="w-5 h-5 text-gray-600 dark:text-gray-400 group-hover:text-purple-600 dark:group-hover:text-purple-400"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-medium text-gray-900 dark:text-white group-hover:text-purple-600 dark:group-hover:text-purple-400 transition-colors">${resource.title}</h4>
                        <p class="text-sm text-gray-600 dark:text-gray-400 truncate">${resource.url}</p>
                    </div>
                    <i data-lucide="external-link" class="w-4 h-4 text-gray-400 group-hover:text-purple-600 dark:group-hover:text-purple-400 flex-shrink-0 opacity-0 group-hover:opacity-100 transition-all"></i>
                </a>
            `;
        }

        function renderSections() {
            const container = document.getElementById('sections-container');
            let html = '';
            
            courseSections.forEach((section, index) => {
                html += `
                    <div class="bg-white dark:bg-gray-800/50 backdrop-blur-sm rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden shadow-sm hover:shadow-md transition-all duration-300">
                        <div role="button" tabindex="0" class="accordion-header w-full px-6 py-5 flex items-center gap-4 hover:bg-gray-50 dark:hover:bg-gray-800/70 transition-colors text-left focus:outline-none cursor-pointer select-none" data-target="content-${section.id}">
                            <div class="flex-shrink-0 text-4xl transition-all duration-300 transform group-hover:scale-110">${section.emoji}</div>
                            <div class="flex-1 min-w-0">
                                <h2 class="text-xl font-bold mb-1 text-gray-900 dark:text-white">${section.title}</h2>
                                <div class="flex items-center gap-4 text-sm text-gray-600 dark:text-gray-400">
                                    <span class="flex items-center gap-1"><i data-lucide="play-circle" class="w-4 h-4"></i> ${section.videos.length} videos</span>
                                    <span class="flex items-center gap-1"><i data-lucide="file-text" class="w-4 h-4"></i> ${section.resources.length} recursos</span>
                                </div>
                            </div>
                            <i data-lucide="chevron-down" class="accordion-icon w-6 h-6 text-gray-400 transition-transform duration-300 flex-shrink-0"></i>
                        </div>

                        <div id="content-${section.id}" class="accordion-content">
                            <div class="accordion-inner px-6 pb-6 border-t border-gray-200 dark:border-gray-700">
                                ${section.description ? `<p class="mt-4 text-gray-700 dark:text-gray-300 mb-6">${section.description}</p>` : ''}

                                ${section.topics && section.topics.length > 0 ? `
                                    <div class="mb-6">
                                        <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3">Temas Cubiertos</h3>
                                        <div class="flex flex-wrap gap-2">
                                            ${section.topics.map(topic => `
                                                <span class="px-3 py-1 bg-blue-50 dark:bg-blue-900/20 text-blue-700 dark:text-blue-300 rounded-full text-sm font-medium border border-blue-200 dark:border-blue-800">${topic}</span>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}

                                <div class="mb-6">
                                    <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                                        <i data-lucide="play-circle" class="w-4 h-4"></i> Videos del Curso
                                    </h3>
                                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                        ${section.videos.map((video, idx) => renderVideoCard(video, idx)).join('')}
                                    </div>
                                </div>

                                ${section.resources.length > 0 ? `
                                    <div>
                                        <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                                            <i data-lucide="external-link" class="w-4 h-4"></i> Recursos Adicionales
                                        </h3>
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            ${section.resources.map(resource => renderResourceLink(resource)).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // --- INTERACTIVITY ---


        // Video Modal Logic
        const modal = document.getElementById('video-modal');
        const modalContent = document.getElementById('video-modal-content');
        const iframe = document.getElementById('youtube-iframe');
        const closeModalBtn = document.getElementById('close-modal');

        window.openVideo = function(videoId) {
            if (!videoId) return;
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            modal.classList.remove('hidden');
            // Small delay to allow display:block to apply before opacity transition
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
            document.body.style.overflow = 'hidden'; // Prevent scrolling
        };

        function closeVideo() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                iframe.src = ''; // Stop video
                document.body.style.overflow = 'auto';
            }, 300);
        }

        closeModalBtn.addEventListener('click', closeVideo);
        
        // Close on background click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeVideo();
        });

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                closeVideo();
            }
        });

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            renderSections();
            
            // Re-run Lucide to render icons in new HTML
            lucide.createIcons();

            // Accordion Logic (Event Delegation)
            const container = document.getElementById('sections-container');
            
            function toggleAccordion(header) {
                const targetId = header.getAttribute('data-target');
                const content = document.getElementById(targetId);
                const icon = header.querySelector('.accordion-icon');
                
                if (content.classList.contains('open')) {
                    content.classList.remove('open');
                    if(icon) icon.classList.remove('rotate-180');
                } else {
                    content.classList.add('open');
                    if(icon) icon.classList.add('rotate-180');
                }
            }

            container.addEventListener('click', (e) => {
                const header = e.target.closest('.accordion-header');
                if (header) {
                    toggleAccordion(header);
                }
            });

            container.addEventListener('keydown', (e) => {
                 const header = e.target.closest('.accordion-header');
                 if (header && (e.key === 'Enter' || e.key === ' ')) {
                     e.preventDefault();
                     toggleAccordion(header);
                 }
            });
        });

    </script>
</body>
</html>
{{ end }}
