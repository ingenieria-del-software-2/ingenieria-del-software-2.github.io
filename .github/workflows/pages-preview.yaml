name: Deploy PR preview

on:
  pull_request:
    branches: ["main", "master"]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "pages-preview-pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy-pr-preview:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.146.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute preview URLs
        id: preview_urls
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          if [[ "${REPO}" == "${OWNER}.github.io" ]]; then
            SITE_ROOT="https://${OWNER}.github.io/"
          else
            SITE_ROOT="https://${OWNER}.github.io/${REPO}/"
          fi
          PREVIEW_URL="${SITE_ROOT}pr-preview/pr-${{ github.event.pull_request.number }}/"
          echo "site_root=${SITE_ROOT}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: github.event.action != 'closed'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Setup Hugo
        if: github.event.action != 'closed'
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci
      - name: Build preview with Hugo
        if: github.event.action != 'closed'
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc --minify \
            --baseURL "${{ steps.preview_urls.outputs.preview_url }}"

      - name: Deploy preview and comment PR
        if: github.event.action != 'closed'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: ${{ steps.preview_urls.outputs.site_root }}
          wait-for-pages-deployment: true

      - name: Remove preview on PR close
        if: github.event.action == 'closed'
        uses: rossjrw/pr-preview-action@v1
        with:
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: ${{ steps.preview_urls.outputs.site_root }}
